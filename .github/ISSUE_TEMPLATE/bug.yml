name: Bug
description: Something broke in the Windows editor or on Android.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach personal media, `%AppData%\PixelCut\projects`, keystores, or `.env` files.
        On Android, export currently writes **only the main track**.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Android
        - Both / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0-beta.5 / SHA-256 of the installer if you have it"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: 1. Open… 2. Import… 3. Export…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
